# The profiles of the Rust slices. buildtools/rust/jfx_rust.cmake passes this file with --config to every cargo call
# that compiles and to the licence check's cargo metadata. A --config file outranks every cargo config file, so each
# profile states every stable setting but two: incremental, which build.incremental decides for every profile, the
# Debug build included, and split-debuginfo, which has no value that every host accepts: jfx_rust.cmake passes it as
# two more --config arguments, "packed" on a *-windows-msvc host, else "off". The environment of these calls, and what
# a cargo config file can still change, are in the comment of the cargo action in jfx_rust.cmake.

# The third-party crates come from buildtools/rust/vendor, filled by cargo vendor, and never from a registry, so a
# cargo call of the build needs neither the network nor a registry cache in CARGO_HOME. Cargo resolves a relative
# path of a configuration file, one given with --config too, against the parent of the directory that holds the
# file, not against the working directory: "rust/vendor" is buildtools/rust/vendor wherever cargo runs.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "rust/vendor"

[build]
incremental = false
# An empty string drops a wrapper that a cargo config file sets
rustc-wrapper = ""
rustc-workspace-wrapper = ""

# panic is "unwind": every export catches panics through jfx_rust_support::guard and returns the C failure value,
# which "abort" would turn into a process abort without an hs_err file.
[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"
debug-assertions = false
overflow-checks = false
lto = true
panic = "unwind"
codegen-units = 1
rpath = false

[profile.dev]
opt-level = 0
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
codegen-units = 256
rpath = false
