#
# This GitHub actions YAML file runs a Maven build on each of the three primary
# platforms: Linux, macOS (both x64 and aarch64), Windows. The jobs are run
# using the default (latest) OS platform for each OS.
# We download a specific version of the boot JDK (Eclipse Temurin on Linux and
# Windows; Oracle on macOS, as Temurin dropped macOS x64 from JDK 27) and use
# the Maven and native toolchains (MSVC, CMake, Xcode) that are preinstalled on
# each runner.
#
# The native javafx.graphics and javafx.media libraries are built by the Maven
# build on all three platforms (via CMake); the unit test suite therefore runs
# everywhere. Two media libraries exist on one platform only and are checked by
# a dedicated step after the build: avplugin on Linux (optional, needs the
# ffmpeg development packages) and jfxmedia_avf on macOS (the AVFoundation
# backend).
#
# The Linux, macOS and Windows jobs also set up the Rust toolchain that
# rust-toolchain.toml pins, plus cbindgen for the build's lint, because
# jfxmedia links a Rust staticlib. A step after the build checks its exports.
# On Linux and Windows jfxmedia must export exactly the JFXM_EXPORT names of
# jfxmedia_api.h. On macOS it must export each of those names and otherwise
# exactly the names of its C build (jfxmedia_avf imports C++ ones), which the
# step builds once more with -DJFX_RUST=false, and load the same libraries in
# the same order; built for Release, it must have no debug map either. An
# actions/cache entry holds the pinned toolchain and the
# cbindgen binary. It is saved per branch, right after the toolchain setup, so
# a job that fails later still saves it; a run restores the entry of its own
# branch or of the default branch, which has one only after a manual run of
# this workflow there. The cache saves only time: the setup step removes what a
# restore left unless it was a complete hit, runs rustup either way and builds
# cbindgen whenever the one it finds is not the pinned version.
#
# The Linux jobs then run the GTK glass display tests, which the build skips for
# want of a display, on a private Xvfb: once without and once with a window
# manager (.github/scripts/run-gtk-display-tests.sh).
#
# One more job, with no Maven and no native toolchain, fails when JNI comes back
# anywhere in the tree (buildtools/CheckNoJni.java, US-074). It reads every
# platform's sources, so the one Linux runner covers macOS and Windows too.
#
# NOTE: much of the build logic is duplicated for each platform. Keep this in
# mind when making changes.
#

name: JavaFX pre-submit tests

on:
  # Run GitHub actions on every push to all branches except the main production branches, also
  # exclude any branch starting with "WIP".
  push:
    branches-ignore:
      - master
      - main
      - 'jfx[0-9]+'
      - 'WIP*'
  # Enable triggering the workflow manually
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no_jni_check:
    name: No JNI
    runs-on: "ubuntu-24.04"

    env:
      BOOT_JDK_VERSION: "27+35"
      BOOT_JDK_FILENAME: "OpenJDK27U-jdk_x64_linux_hotspot_27_35.tar.gz"
      BOOT_JDK_URL: "https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27%2B35/OpenJDK27U-jdk_x64_linux_hotspot_27_35.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          which java
          java -version

      - name: Prove the JNI check catches every rule
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Plants each rule of US-074 acceptance criterion 7 in a temporary directory and fails
          # unless the check reports it, and unless the same text in comments passes.
          java buildtools/CheckNoJni.java --self-test

      - name: Check that no JNI is in the tree
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Every file git tracks, every platform: a native method or @Native, a Java_* or
          # JNI_OnLoad export, a JNI type or call (in string literals too), jni.h, a JDK include
          # directory, javac -h, or System.load*. Exit 1 lists the hits; exit 2 is a stale or
          # malformed entry of buildtools/CheckNoJni.allowlist.
          java buildtools/CheckNoJni.java .

  linux_x64_build:
    name: Linux x64
    runs-on: "ubuntu-24.04"

    env:
      BOOT_JDK_VERSION: "27+35"
      BOOT_JDK_FILENAME: "OpenJDK27U-jdk_x64_linux_hotspot_27_35.tar.gz"
      BOOT_JDK_URL: "https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27%2B35/OpenJDK27U-jdk_x64_linux_hotspot_27_35.tar.gz"
      # Must equal JFX_CBINDGEN_VERSION of buildtools/rust/jfx_rust.cmake: its lint fails on any other version.
      CBINDGEN_VERSION: "0.29.4"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Install build dependencies
        run: |
          set -x
          sudo apt-get update
          # The libav* packages are for the Linux-only avplugin, which
          # modules/javafx.media/native/linux.cmake builds only when pkg-config finds
          # them and otherwise skips with a STATUS message. libavcodec and libavformat
          # are compiled and linked against; libswscale supplies a header only - the
          # library itself is loaded with dlopen at runtime by plugins/av/videodecoder.c
          # and is deliberately never linked, so a system without it degrades instead
          # of failing to load.
          # libxtst6 is a run-time requirement, not a build one: no native library links
          # libXtst, but com.sun.glass.ui.gtk.GtkGlassNative opens libXtst.so.6, and
          # GtkGlassNativeHeadlessTest initializes that class without a display.
          sudo apt-get -y install libgl1-mesa-dev libx11-dev libxxf86vm-dev libxt-dev \
            pkg-config libgtk-3-dev libxtst6 libfreetype-dev libpango1.0-dev libasound2-dev \
            libavcodec-dev libavformat-dev libswscale-dev

      - name: Provide a null ALSA device
        run: |
          set -x
          # The javafx.media unit tests build a real GStreamer playback pipeline, whose Linux
          # audio sink is alsasink; it opens the default PCM as soon as the pipeline goes to
          # READY. A GitHub-hosted runner has no sound card, so that open fails, the pipeline
          # state change fails and GSTPlatform.createMediaPlayer hands back null. A null PCM
          # accepts the audio and discards it, which is all these tests need: nothing is played.
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "${HOME}/.asoundrc"

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          mvn -version

      - name: Locate the pinned Rust toolchain and the cargo and rustup homes
        id: rust
        # Feeds only the cache steps and the setup step's removal of what a restore left, which all do nothing
        # when this step fails: the job goes on without a cache.
        continue-on-error: true
        working-directory: jfx
        run: |
          set -x
          channel=$(grep -m 1 -oP '^\s*channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "cargo_home=${CARGO_HOME:-${HOME}/.cargo}" >> "${GITHUB_OUTPUT}"
          echo "rustup_home=${RUSTUP_HOME:-${HOME}/.rustup}" >> "${GITHUB_OUTPUT}"

      - name: Restore the pinned Rust toolchain and cbindgen from the cache
        id: rust_cache
        if: ${{ steps.rust.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Nothing else of the two homes: the image's own rustup and toolchains live there too.
          path: |
            ${{ steps.rust.outputs.rustup_home }}/toolchains/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.rustup_home }}/update-hashes/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.cargo_home }}/bin/cbindgen
          key: >-
            ${{ format('rust-{0}-{1}-{2}-cbindgen-{3}', runner.os, runner.arch,
            hashFiles('jfx/rust-toolchain.toml'), env.CBINDGEN_VERSION) }}

      - name: Set up the Rust toolchain
        working-directory: jfx
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_CHANNEL: ${{ steps.rust.outputs.channel }}
          CACHE_RUSTUP_HOME: ${{ steps.rust.outputs.rustup_home }}
          CACHE_CARGO_HOME: ${{ steps.rust.outputs.cargo_home }}
        run: |
          set -x
          # jfxmedia links a Rust staticlib (buildtools/rust/jfx_rust.cmake). In the repository root,
          # rustup installs the toolchain that rust-toolchain.toml pins, and the lint of the build
          # (jfx_rust_lint) needs the pinned cbindgen. An image without rustup gets rustup-init the
          # way the boot JDK is fetched. A restore that was not a hit can still have written part of
          # the toolchain (a failed extraction keeps its files and sets no cache-hit), which rustup
          # may take for an installed toolchain or fail on, so whatever the restore step's three
          # paths match is removed first. The cache thus saves only time: rustup toolchain install
          # runs either way, and cargo builds cbindgen unless the one on PATH is the pinned version.
          if [ -n "${CACHE_CHANNEL}" ] && [ -n "${CACHE_RUSTUP_HOME}" ] && [ -n "${CACHE_CARGO_HOME}" ] \
            && [ "${CACHE_HIT}" != "true" ]; then
            for cached in "${CACHE_RUSTUP_HOME}/toolchains/${CACHE_CHANNEL}"-* \
              "${CACHE_RUSTUP_HOME}/update-hashes/${CACHE_CHANNEL}"-* "${CACHE_CARGO_HOME}/bin/cbindgen"; do
              if [ -e "${cached}" ] || [ -L "${cached}" ]; then
                rm -rf -- "${cached}"
              fi
            done
          fi
          cargo_bin="${CARGO_HOME:-${HOME}/.cargo}/bin"
          if ! command -v rustup > /dev/null; then
            wget -O "${HOME}/rustup-init" "https://static.rust-lang.org/rustup/dist/$(uname -m)-unknown-linux-gnu/rustup-init"
            chmod +x "${HOME}/rustup-init"
            "${HOME}/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          fi
          export PATH="${cargo_bin}:${PATH}"
          echo "${cargo_bin}" >> "${GITHUB_PATH}"
          rustup toolchain install
          if [ "$(cbindgen --version 2> /dev/null)" != "cbindgen ${CBINDGEN_VERSION}" ]; then
            # A restored binary is not in cargo's install records, and cargo overwrites such a file
            # only with --force.
            cargo install --locked --force "cbindgen@${CBINDGEN_VERSION}"
          fi
          rustup show active-toolchain

      - name: Save the pinned Rust toolchain and cbindgen to the cache
        # Right after the setup, so that a job that fails later still saves it. The paths must be the
        # restore step's, character for character: the version of a cache entry is a hash of them.
        if: ${{ steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.cache-primary-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.rust.outputs.rustup_home }}/toolchains/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.rustup_home }}/update-hashes/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.cargo_home }}/bin/cbindgen
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Full build: Java modules, native libraries (CMake + gcc) and the
          # unit test suite. Web and system tests are skipped by default.
          # -fae (fail-at-end) approximates the "gradlew --continue" that the old CI
          # passed to its separate test run: after a failure Maven still builds and
          # tests every module that does not depend on the failed one.
          mvn -B -ntp -fae install "-Djfx.web.skipFfmTests=false"

      - name: Install a virtual display and a window manager
        run: |
          set -x
          # For the GTK display tests below: xvfb for a private X server, openbox for the run
          # with a window manager, x11-utils for the xdpyinfo and xprop that the script uses to
          # wait for both, and dbus-daemon for the dbus-run-session that gives the tests a session
          # bus of their own. The runner image already has xvfb and dbus-daemon.
          sudo apt-get -y install --no-install-recommends xvfb openbox x11-utils dbus-daemon

      - name: Run the GTK display tests on a private Xvfb
        id: gtk_display_tests
        timeout-minutes: 30
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # The install step runs the GTK glass tests without a display, so only the
          # headless classes of test/com/sun/glass/ui/gtk run there. This runs all of them on a
          # private Xvfb at 1920x1080x24, against the natives that step built: first with no
          # window manager, then under openbox, with -DPRIVATE_DISPLAY=true and
          # -DUSE_ROBOT=true. The script fails the step when either run fails, and a run also
          # fails when its children did not record the screen and window manager it claims, or
          # when a class reports no tests without being listed with its reason.
          bash .github/scripts/run-gtk-display-tests.sh

      - name: Upload the GTK display test reports
        if: ${{ failure() && steps.gtk_display_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gtk-display-tests-linux-x64
          # Each run's report, Maven log, surefire reports, child JVM directories (stdout,
          # stderr, recorded values, fatal error logs) and Xvfb and openbox logs; the last three
          # paths exist only if the step was stopped in the middle of a run.
          path: |
            jfx/modules/javafx.graphics/target/gtk-display-tests/
            jfx/modules/javafx.graphics/target/surefire-reports/
            jfx/modules/javafx.graphics/target/gtk-glass-child/
            jfx/modules/javafx.graphics/hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify the optional avplugin was built
        if: ${{ !cancelled() }}
        working-directory: jfx
        run: |
          set -x
          # avplugin is the one media library whose CMake target is conditional, so a
          # dropped ffmpeg development package would remove ffmpeg-backed playback from
          # the build and from the artifacts with no other signal at all. Assert it.
          so=modules/javafx.media/target/native/bin/libavplugin.so
          if [ ! -f "${so}" ]; then
            echo "::error::${so} was not built - check libavcodec-dev/libavformat-dev/libswscale-dev"
            exit 1
          fi
          # The assignment doubles as an assertion: under bash -e a file with no
          # dynamic section leaves grep without a match, which fails the step here.
          needed=$(readelf -d "${so}" | grep NEEDED)
          echo "${needed}"
          # libswscale must not be among them. avplugin compiles against
          # <libswscale/swscale.h>, but every sws_* entry point is reached through
          # dlopen/dlsym in plugins/av/videodecoder.c, so a system without the library
          # loses only H.265/HEVC 10/12-bit decoding instead of failing to load the
          # plugin at all. A NEEDED entry would turn that recoverable capability check
          # into a hard load failure.
          if echo "${needed}" | grep -q libswscale; then
            echo "::error::${so} must dlopen libswscale at runtime, not link against it"
            exit 1
          fi
          nm -D --defined-only "${so}" | grep gst_plugin_desc

      - name: Verify the exports of jfxmedia, which links Rust
        if: ${{ !cancelled() }}
        working-directory: jfx
        run: |
          set -x
          # jfxm_abi_version comes from a Rust staticlib (buildtools/rust/jfx_rust.cmake). The version
          # script generated from jfxmedia_api.h exports exactly the names the header declares, so the
          # two lists must be equal: any other name (C++, the Rust standard library's, a C helper's)
          # means the script no longer applies. ldd -r must then resolve every symbol and library.
          # Like the build, a name the header declares twice (in two #if branches) counts once.
          so=modules/javafx.media/target/native/bin/libjfxmedia.so
          header=modules/javafx.media/src/main/native/jfxmedia/jfxmedia_api.h
          if [ ! -f "${so}" ]; then
            echo "::error::${so} was not built"
            exit 1
          fi
          expected=$(grep -oP '^JFXM_EXPORT\b[^(]*?\K\w+(?=\s*\()' "${header}" | sort -u)
          exported=$(nm -D --defined-only "${so}" | awk '{ print $NF }' | sort)
          echo "$(echo "${expected}" | wc -l) names in the header, $(echo "${exported}" | wc -l) exported"
          if [ -z "${expected}" ]; then
            echo "::error::no JFXM_EXPORT line found in ${header}"
            exit 1
          fi
          if ! diff <(echo "${expected}") <(echo "${exported}"); then
            echo "::error::${so} must export exactly the JFXM_EXPORT names of ${header} (<: header, >: library)"
            exit 1
          fi
          readelf -d "${so}" | grep NEEDED
          if ldd -r "${so}" 2>&1 | grep -E 'undefined symbol|not found'; then
            echo "::error::${so} has an unresolved symbol or library"
            exit 1
          fi

  linux_aarch64_build:
    name: Linux aarch64
    runs-on: "ubuntu-24.04-arm"

    env:
      BOOT_JDK_VERSION: "27+35"
      BOOT_JDK_FILENAME: "OpenJDK27U-jdk_aarch64_linux_hotspot_27_35.tar.gz"
      BOOT_JDK_URL: "https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27%2B35/OpenJDK27U-jdk_aarch64_linux_hotspot_27_35.tar.gz"
      # Must equal JFX_CBINDGEN_VERSION of buildtools/rust/jfx_rust.cmake: its lint fails on any other version.
      CBINDGEN_VERSION: "0.29.4"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Install build dependencies
        run: |
          set -x
          sudo apt-get update
          # The libav* packages are for the Linux-only avplugin, which
          # modules/javafx.media/native/linux.cmake builds only when pkg-config finds
          # them and otherwise skips with a STATUS message. libavcodec and libavformat
          # are compiled and linked against; libswscale supplies a header only - the
          # library itself is loaded with dlopen at runtime by plugins/av/videodecoder.c
          # and is deliberately never linked, so a system without it degrades instead
          # of failing to load.
          # libxtst6 is a run-time requirement, not a build one: no native library links
          # libXtst, but com.sun.glass.ui.gtk.GtkGlassNative opens libXtst.so.6, and
          # GtkGlassNativeHeadlessTest initializes that class without a display.
          sudo apt-get -y install libgl1-mesa-dev libx11-dev libxxf86vm-dev libxt-dev \
            pkg-config libgtk-3-dev libxtst6 libfreetype-dev libpango1.0-dev libasound2-dev \
            libavcodec-dev libavformat-dev libswscale-dev

      - name: Provide a null ALSA device
        run: |
          set -x
          # The javafx.media unit tests build a real GStreamer playback pipeline, whose Linux
          # audio sink is alsasink; it opens the default PCM as soon as the pipeline goes to
          # READY. A GitHub-hosted runner has no sound card, so that open fails, the pipeline
          # state change fails and GSTPlatform.createMediaPlayer hands back null. A null PCM
          # accepts the audio and discards it, which is all these tests need: nothing is played.
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "${HOME}/.asoundrc"

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          mvn -version

      - name: Locate the pinned Rust toolchain and the cargo and rustup homes
        id: rust
        # Feeds only the cache steps and the setup step's removal of what a restore left, which all do nothing
        # when this step fails: the job goes on without a cache.
        continue-on-error: true
        working-directory: jfx
        run: |
          set -x
          channel=$(grep -m 1 -oP '^\s*channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "cargo_home=${CARGO_HOME:-${HOME}/.cargo}" >> "${GITHUB_OUTPUT}"
          echo "rustup_home=${RUSTUP_HOME:-${HOME}/.rustup}" >> "${GITHUB_OUTPUT}"

      - name: Restore the pinned Rust toolchain and cbindgen from the cache
        id: rust_cache
        if: ${{ steps.rust.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Nothing else of the two homes: the image's own rustup and toolchains live there too.
          path: |
            ${{ steps.rust.outputs.rustup_home }}/toolchains/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.rustup_home }}/update-hashes/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.cargo_home }}/bin/cbindgen
          key: >-
            ${{ format('rust-{0}-{1}-{2}-cbindgen-{3}', runner.os, runner.arch,
            hashFiles('jfx/rust-toolchain.toml'), env.CBINDGEN_VERSION) }}

      - name: Set up the Rust toolchain
        working-directory: jfx
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_CHANNEL: ${{ steps.rust.outputs.channel }}
          CACHE_RUSTUP_HOME: ${{ steps.rust.outputs.rustup_home }}
          CACHE_CARGO_HOME: ${{ steps.rust.outputs.cargo_home }}
        run: |
          set -x
          # jfxmedia links a Rust staticlib (buildtools/rust/jfx_rust.cmake). In the repository root,
          # rustup installs the toolchain that rust-toolchain.toml pins, and the lint of the build
          # (jfx_rust_lint) needs the pinned cbindgen. An image without rustup gets rustup-init the
          # way the boot JDK is fetched. A restore that was not a hit can still have written part of
          # the toolchain (a failed extraction keeps its files and sets no cache-hit), which rustup
          # may take for an installed toolchain or fail on, so whatever the restore step's three
          # paths match is removed first. The cache thus saves only time: rustup toolchain install
          # runs either way, and cargo builds cbindgen unless the one on PATH is the pinned version.
          if [ -n "${CACHE_CHANNEL}" ] && [ -n "${CACHE_RUSTUP_HOME}" ] && [ -n "${CACHE_CARGO_HOME}" ] \
            && [ "${CACHE_HIT}" != "true" ]; then
            for cached in "${CACHE_RUSTUP_HOME}/toolchains/${CACHE_CHANNEL}"-* \
              "${CACHE_RUSTUP_HOME}/update-hashes/${CACHE_CHANNEL}"-* "${CACHE_CARGO_HOME}/bin/cbindgen"; do
              if [ -e "${cached}" ] || [ -L "${cached}" ]; then
                rm -rf -- "${cached}"
              fi
            done
          fi
          cargo_bin="${CARGO_HOME:-${HOME}/.cargo}/bin"
          if ! command -v rustup > /dev/null; then
            wget -O "${HOME}/rustup-init" "https://static.rust-lang.org/rustup/dist/$(uname -m)-unknown-linux-gnu/rustup-init"
            chmod +x "${HOME}/rustup-init"
            "${HOME}/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          fi
          export PATH="${cargo_bin}:${PATH}"
          echo "${cargo_bin}" >> "${GITHUB_PATH}"
          rustup toolchain install
          if [ "$(cbindgen --version 2> /dev/null)" != "cbindgen ${CBINDGEN_VERSION}" ]; then
            # A restored binary is not in cargo's install records, and cargo overwrites such a file
            # only with --force.
            cargo install --locked --force "cbindgen@${CBINDGEN_VERSION}"
          fi
          rustup show active-toolchain

      - name: Save the pinned Rust toolchain and cbindgen to the cache
        # Right after the setup, so that a job that fails later still saves it. The paths must be the
        # restore step's, character for character: the version of a cache entry is a hash of them.
        if: ${{ steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.cache-primary-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.rust.outputs.rustup_home }}/toolchains/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.rustup_home }}/update-hashes/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.cargo_home }}/bin/cbindgen
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Full build: Java modules, native libraries (CMake + gcc) and the
          # unit test suite. Web and system tests are skipped by default.
          # -fae (fail-at-end) approximates the "gradlew --continue" that the old CI
          # passed to its separate test run: after a failure Maven still builds and
          # tests every module that does not depend on the failed one.
          mvn -B -ntp -fae install "-Djfx.web.skipFfmTests=false"

      - name: Install a virtual display and a window manager
        run: |
          set -x
          # For the GTK display tests below: xvfb for a private X server, openbox for the run
          # with a window manager, x11-utils for the xdpyinfo and xprop that the script uses to
          # wait for both, and dbus-daemon for the dbus-run-session that gives the tests a session
          # bus of their own. The runner image already has xvfb and dbus-daemon.
          sudo apt-get -y install --no-install-recommends xvfb openbox x11-utils dbus-daemon

      - name: Run the GTK display tests on a private Xvfb
        id: gtk_display_tests
        timeout-minutes: 30
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # The install step runs the GTK glass tests without a display, so only the
          # headless classes of test/com/sun/glass/ui/gtk run there. This runs all of them on a
          # private Xvfb at 1920x1080x24, against the natives that step built: first with no
          # window manager, then under openbox, with -DPRIVATE_DISPLAY=true and
          # -DUSE_ROBOT=true. The script fails the step when either run fails, and a run also
          # fails when its children did not record the screen and window manager it claims, or
          # when a class reports no tests without being listed with its reason.
          bash .github/scripts/run-gtk-display-tests.sh

      - name: Upload the GTK display test reports
        if: ${{ failure() && steps.gtk_display_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gtk-display-tests-linux-aarch64
          # Each run's report, Maven log, surefire reports, child JVM directories (stdout,
          # stderr, recorded values, fatal error logs) and Xvfb and openbox logs; the last three
          # paths exist only if the step was stopped in the middle of a run.
          path: |
            jfx/modules/javafx.graphics/target/gtk-display-tests/
            jfx/modules/javafx.graphics/target/surefire-reports/
            jfx/modules/javafx.graphics/target/gtk-glass-child/
            jfx/modules/javafx.graphics/hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify the optional avplugin was built
        if: ${{ !cancelled() }}
        working-directory: jfx
        run: |
          set -x
          # avplugin is the one media library whose CMake target is conditional, so a
          # dropped ffmpeg development package would remove ffmpeg-backed playback from
          # the build and from the artifacts with no other signal at all. Assert it.
          so=modules/javafx.media/target/native/bin/libavplugin.so
          if [ ! -f "${so}" ]; then
            echo "::error::${so} was not built - check libavcodec-dev/libavformat-dev/libswscale-dev"
            exit 1
          fi
          # The assignment doubles as an assertion: under bash -e a file with no
          # dynamic section leaves grep without a match, which fails the step here.
          needed=$(readelf -d "${so}" | grep NEEDED)
          echo "${needed}"
          # libswscale must not be among them. avplugin compiles against
          # <libswscale/swscale.h>, but every sws_* entry point is reached through
          # dlopen/dlsym in plugins/av/videodecoder.c, so a system without the library
          # loses only H.265/HEVC 10/12-bit decoding instead of failing to load the
          # plugin at all. A NEEDED entry would turn that recoverable capability check
          # into a hard load failure.
          if echo "${needed}" | grep -q libswscale; then
            echo "::error::${so} must dlopen libswscale at runtime, not link against it"
            exit 1
          fi
          nm -D --defined-only "${so}" | grep gst_plugin_desc

      - name: Verify the exports of jfxmedia, which links Rust
        if: ${{ !cancelled() }}
        working-directory: jfx
        run: |
          set -x
          # jfxm_abi_version comes from a Rust staticlib (buildtools/rust/jfx_rust.cmake). The version
          # script generated from jfxmedia_api.h exports exactly the names the header declares, so the
          # two lists must be equal: any other name (C++, the Rust standard library's, a C helper's)
          # means the script no longer applies. ldd -r must then resolve every symbol and library.
          # Like the build, a name the header declares twice (in two #if branches) counts once.
          so=modules/javafx.media/target/native/bin/libjfxmedia.so
          header=modules/javafx.media/src/main/native/jfxmedia/jfxmedia_api.h
          if [ ! -f "${so}" ]; then
            echo "::error::${so} was not built"
            exit 1
          fi
          expected=$(grep -oP '^JFXM_EXPORT\b[^(]*?\K\w+(?=\s*\()' "${header}" | sort -u)
          exported=$(nm -D --defined-only "${so}" | awk '{ print $NF }' | sort)
          echo "$(echo "${expected}" | wc -l) names in the header, $(echo "${exported}" | wc -l) exported"
          if [ -z "${expected}" ]; then
            echo "::error::no JFXM_EXPORT line found in ${header}"
            exit 1
          fi
          if ! diff <(echo "${expected}") <(echo "${exported}"); then
            echo "::error::${so} must export exactly the JFXM_EXPORT names of ${header} (<: header, >: library)"
            exit 1
          fi
          readelf -d "${so}" | grep NEEDED
          if ldd -r "${so}" 2>&1 | grep -E 'undefined symbol|not found'; then
            echo "::error::${so} has an unresolved symbol or library"
            exit 1
          fi

  macos_x64_build:
    name: macOS x64
    runs-on: "macos-15-intel"

    env:
      BOOT_JDK_VERSION: "27"
      BOOT_JDK_FILENAME: "jdk-27_macos-x64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/27/archive/jdk-27_macos-x64_bin.tar.gz"
      # Must equal JFX_CBINDGEN_VERSION of buildtools/rust/jfx_rust.cmake: its lint fails on any other version.
      CBINDGEN_VERSION: "0.29.4"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          curl -L -o "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}.jdk/Contents/Home"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          mvn -version

      - name: Locate the pinned Rust toolchain and the cargo and rustup homes
        id: rust
        # Feeds only the cache steps and the setup step's removal of what a restore left, which all do nothing
        # when this step fails: the job goes on without a cache.
        continue-on-error: true
        working-directory: jfx
        run: |
          set -x
          # macOS grep has no -P, so the value is cut out of the line by parameter expansion
          line=$(grep -m 1 -E '^[[:space:]]*channel[[:space:]]*=[[:space:]]*"[^"]' rust-toolchain.toml)
          channel=${line#*\"}
          channel=${channel%%\"*}
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "cargo_home=${CARGO_HOME:-${HOME}/.cargo}" >> "${GITHUB_OUTPUT}"
          echo "rustup_home=${RUSTUP_HOME:-${HOME}/.rustup}" >> "${GITHUB_OUTPUT}"

      - name: Restore the pinned Rust toolchain and cbindgen from the cache
        id: rust_cache
        if: ${{ steps.rust.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Nothing else of the two homes: the image's own rustup and toolchains live there too.
          path: |
            ${{ steps.rust.outputs.rustup_home }}/toolchains/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.rustup_home }}/update-hashes/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.cargo_home }}/bin/cbindgen
          key: >-
            ${{ format('rust-{0}-{1}-{2}-cbindgen-{3}', runner.os, runner.arch,
            hashFiles('jfx/rust-toolchain.toml'), env.CBINDGEN_VERSION) }}

      - name: Set up the Rust toolchain
        working-directory: jfx
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_CHANNEL: ${{ steps.rust.outputs.channel }}
          CACHE_RUSTUP_HOME: ${{ steps.rust.outputs.rustup_home }}
          CACHE_CARGO_HOME: ${{ steps.rust.outputs.cargo_home }}
        run: |
          set -x
          # jfxmedia links a Rust staticlib (buildtools/rust/jfx_rust.cmake). In the repository root,
          # rustup installs the toolchain that rust-toolchain.toml pins, and the lint of the build
          # (jfx_rust_lint) needs the pinned cbindgen. An image without rustup gets rustup-init the
          # way the boot JDK is fetched. A restore that was not a hit can still have written part of
          # the toolchain (a failed extraction keeps its files and sets no cache-hit), which rustup
          # may take for an installed toolchain or fail on, so whatever the restore step's three
          # paths match is removed first. The cache thus saves only time: rustup toolchain install
          # runs either way, and cargo builds cbindgen unless the one on PATH is the pinned version.
          if [ -n "${CACHE_CHANNEL}" ] && [ -n "${CACHE_RUSTUP_HOME}" ] && [ -n "${CACHE_CARGO_HOME}" ] \
            && [ "${CACHE_HIT}" != "true" ]; then
            for cached in "${CACHE_RUSTUP_HOME}/toolchains/${CACHE_CHANNEL}"-* \
              "${CACHE_RUSTUP_HOME}/update-hashes/${CACHE_CHANNEL}"-* "${CACHE_CARGO_HOME}/bin/cbindgen"; do
              if [ -e "${cached}" ] || [ -L "${cached}" ]; then
                rm -rf -- "${cached}"
              fi
            done
          fi
          cargo_bin="${CARGO_HOME:-${HOME}/.cargo}/bin"
          if ! command -v rustup > /dev/null; then
            # -f: unlike wget, curl would otherwise save an HTTP error page as rustup-init
            curl -fL -o "${HOME}/rustup-init" \
              "https://static.rust-lang.org/rustup/dist/x86_64-apple-darwin/rustup-init"
            chmod +x "${HOME}/rustup-init"
            "${HOME}/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          fi
          export PATH="${cargo_bin}:${PATH}"
          echo "${cargo_bin}" >> "${GITHUB_PATH}"
          rustup toolchain install
          if [ "$(cbindgen --version 2> /dev/null)" != "cbindgen ${CBINDGEN_VERSION}" ]; then
            # A restored binary is not in cargo's install records, and cargo overwrites such a file
            # only with --force.
            cargo install --locked --force "cbindgen@${CBINDGEN_VERSION}"
          fi
          rustup show active-toolchain

      - name: Save the pinned Rust toolchain and cbindgen to the cache
        # Right after the setup, so that a job that fails later still saves it. The paths must be the
        # restore step's, character for character: the version of a cache entry is a hash of them.
        if: ${{ steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.cache-primary-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.rust.outputs.rustup_home }}/toolchains/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.rustup_home }}/update-hashes/${{ steps.rust.outputs.channel }}-*
            ${{ steps.rust.outputs.cargo_home }}/bin/cbindgen
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Full build: Java modules, native libraries (CMake + clang, Metal
          # shaders) and the unit test suite. Web and system tests are skipped
          # by default.
          # -fae (fail-at-end) approximates the "gradlew --continue" that the old CI
          # passed to its separate test run: after a failure Maven still builds and
          # tests every module that does not depend on the failed one.
          mvn -B -ntp -fae install "-Djfx.web.skipFfmTests=false"

      - name: Verify the AVFoundation backend compiled and linked
        if: ${{ !cancelled() }}
        working-directory: jfx
        run: |
          set -x
          # add_media_library uses SHARED with clang's default -undefined error,
          # so macOS is the one platform where a dangling symbol is fatal at
          # link - which is what makes a clean link here real evidence rather
          # than a formality. This runs even when an earlier step failed, so the
          # AVF result is reported either way.
          dylib=modules/javafx.media/target/native/bin/libjfxmedia_avf.dylib
          if [ ! -f "${dylib}" ]; then
            echo "::error::${dylib} was not built - the AVFoundation backend did not compile or link"
            exit 1
          fi
          file "${dylib}"
          otool -L "${dylib}"
          nm -gU "${dylib}" | head -40

      - name: Verify the exports of jfxmedia, which links Rust
        if: ${{ !cancelled() }}
        working-directory: jfx
        run: |
          set -x
          # jfxm_abi_version comes from a Rust staticlib (buildtools/rust/jfx_rust.cmake). The other names of the
          # archive stay local through an -unexported_symbols_list, not through an export list of the header's
          # names, as libjfxmedia_avf imports C++ names from jfxmedia. So the library must export every JFXM_EXPORT
          # name of jfxmedia_api.h and otherwise exactly what its C build exports, and load the same libraries in
          # the same order: any other name (the Rust standard library's) or library means the list no longer
          # applies. The C build is made once more for this, outside the Maven tree. A Release build must also
          # have no debug map: std's objects bring one, whose N_OSO stab names the archive member by its path in
          # the build tree. A name the header declares twice (in two #if branches) counts once.
          lib=modules/javafx.media/target/native/bin/libjfxmedia.dylib
          header=modules/javafx.media/src/main/native/jfxmedia/jfxmedia_api.h
          tree=modules/javafx.media/target/native/cmake
          origin="${tree}/jfx-rust/logs/jfxmedia-origin.log"
          work="${RUNNER_TEMP}/jfxmedia-exports"
          if [ ! -f "${lib}" ]; then
            echo "::error::${lib} was not built"
            exit 1
          fi
          otool -L "${lib}"
          if [ ! -f "${origin}" ]; then
            echo "::error::no ${origin}: the link of ${lib} did not check the origin of its Rust exports"
            exit 1
          fi
          cat "${origin}"
          mkdir -p "${work}"
          # Mach-O names carry a leading _
          perl -nle 'print "_$&" if /^JFXM_EXPORT\b[^(]*?\K\w+(?=\s*\()/' "${header}" | LC_ALL=C sort -u \
            > "${work}/header.txt"
          nm -gUj "${lib}" | LC_ALL=C sort > "${work}/rust.txt"
          header_count=$(awk 'END { print NR }' "${work}/header.txt")
          export_count=$(awk 'END { print NR }' "${work}/rust.txt")
          echo "${header_count} names in the header, ${export_count} exported"
          if [ ! -s "${work}/header.txt" ]; then
            echo "::error::no JFXM_EXPORT line found in ${header}"
            exit 1
          fi
          missing=$(LC_ALL=C comm -23 "${work}/header.txt" "${work}/rust.txt")
          if [ -n "${missing}" ]; then
            echo "${missing}"
            echo "::error::${lib} does not export the JFXM_EXPORT names of ${header} listed above"
            exit 1
          fi
          # The C build: the arguments mirror the cmake-configure execution of the native-mac profile of
          # modules/javafx.media/pom.xml, with the values Maven passed (read from its CMakeCache.txt), but with a
          # build tree and a BIN_DIR of its own and with -DJFX_RUST=false. A slice of jfxmedia marked C_DELETED
          # fails this configure, so the change that marks one must give this check another baseline.
          maven_value() {
            sed -n "s/^$1:[A-Z]*=//p" "${tree}/CMakeCache.txt"
          }
          build_type=$(maven_value CMAKE_BUILD_TYPE)
          c_tree="${RUNNER_TEMP}/jfxmedia-c"
          cmake -S modules/javafx.media/native -B "${c_tree}/cmake" "-DCMAKE_BUILD_TYPE=${build_type}" \
            "-DGENSRC_DIR=$(maven_value GENSRC_DIR)" "-DHEADERS_DIR=$(maven_value HEADERS_DIR)" \
            "-DBIN_DIR=${c_tree}/bin" "-DJFX_VER=$(maven_value JFX_VER)" "-DJFX_FVER=$(maven_value JFX_FVER)" \
            "-DJFX_BUILD_ID=$(maven_value JFX_BUILD_ID)" -DJFX_RUST=false
          cmake --build "${c_tree}/cmake" --parallel --target jfxmedia
          c_lib="${c_tree}/bin/libjfxmedia.dylib"
          nm -gUj "${c_lib}" | LC_ALL=C sort > "${work}/c.txt"
          if ! diff "${work}/c.txt" "${work}/rust.txt"; then
            echo "::error::${lib} must export exactly the names of the C build ${c_lib} (<: C, >: Rust)"
            exit 1
          fi
          otool -L "${c_lib}" | tail -n +2 > "${work}/c-dependencies.txt"
          otool -L "${lib}" | tail -n +2 > "${work}/rust-dependencies.txt"
          if ! diff "${work}/c-dependencies.txt" "${work}/rust-dependencies.txt"; then
            echo "::error::${lib} must load the libraries of the C build ${c_lib} in the same order (<: C, >: Rust)"
            exit 1
          fi
          if [ "${build_type}" = Release ]; then
            stabs=$(nm -a "${lib}" | awk '$2 == "-" && $5 == "OSO"')
            if [ -n "${stabs}" ]; then
              echo "${stabs}"
              echo "::error::${lib} is a Release build with a debug map (the N_OSO stabs above): link it with -S"
              exit 1
            fi
          fi

