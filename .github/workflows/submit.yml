#
# This GitHub actions YAML file runs a Maven build on each of the three primary
# platforms: Linux, macOS (both x64 and aarch64), Windows. The jobs are run
# using the default (latest) OS platform for each OS.
# We download a specific version of the boot JDK and use the Maven and native
# toolchains (MSVC, CMake, Xcode) that are preinstalled on each runner.
#
# The native javafx.graphics libraries are built by the Maven build on all
# three platforms (via CMake); the unit test suite therefore runs everywhere.
#
# NOTE: much of the build logic is duplicated for each platform. Keep this in
# mind when making changes.
#

name: JavaFX pre-submit tests

on:
  # Run GitHub actions on every push to all branches except the main production branches, also
  # exclude any branch starting with "WIP".
  push:
    branches-ignore:
      - master
      - main
      - 'jfx[0-9]+'
      - 'WIP*'
  # Enable triggering the workflow manually
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux_x64_build:
    name: Linux x64
    runs-on: "ubuntu-24.04"

    env:
      BOOT_JDK_VERSION: "26.0.2"
      BOOT_JDK_FILENAME: "jdk-26.0.2_linux-x64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/26/archive/jdk-26.0.2_linux-x64_bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Install build dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get -y install libgl1-mesa-dev libx11-dev libxxf86vm-dev libxt-dev \
            pkg-config libgtk-3-dev libxtst-dev libfreetype-dev libpango1.0-dev

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          mvn -version

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Full build: Java modules, native libraries (CMake + gcc) and the
          # unit test suite. Web and system tests are skipped by default.
          mvn -B -ntp install

  linux_aarch64_build:
    name: Linux aarch64
    runs-on: "ubuntu-24.04-arm"

    env:
      BOOT_JDK_VERSION: "26.0.2"
      BOOT_JDK_FILENAME: "jdk-26.0.2_linux-aarch64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/26/archive/jdk-26.0.2_linux-aarch64_bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Install build dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get -y install libgl1-mesa-dev libx11-dev libxxf86vm-dev libxt-dev \
            pkg-config libgtk-3-dev libxtst-dev libfreetype-dev libpango1.0-dev

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          mvn -version

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Full build: Java modules, native libraries (CMake + gcc) and the
          # unit test suite. Web and system tests are skipped by default.
          mvn -B -ntp install

  macos_x64_build:
    name: macOS x64
    runs-on: "macos-15-intel"

    env:
      BOOT_JDK_VERSION: "26.0.2"
      BOOT_JDK_FILENAME: "jdk-26.0.2_macos-x64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/26/archive/jdk-26.0.2_macos-x64_bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          curl -L -o "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}.jdk/Contents/Home"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          mvn -version

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Full build: Java modules, native libraries (CMake + clang, Metal
          # shaders) and the unit test suite. Web and system tests are skipped
          # by default.
          mvn -B -ntp install

  macos_aarch64_build:
    name: macOS aarch64
    runs-on: "macos-15"

    env:
      BOOT_JDK_VERSION: "26.0.2"
      BOOT_JDK_FILENAME: "jdk-26.0.2_macos-aarch64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/26/archive/jdk-26.0.2_macos-aarch64_bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          curl -L -o "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}.jdk/Contents/Home"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          mvn -version

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Full build: Java modules, native libraries (CMake + clang, Metal
          # shaders) and the unit test suite. Web and system tests are skipped
          # by default.
          mvn -B -ntp install

  windows_x64_build:
    name: Windows x64
    runs-on: "windows-2022"

    env:
      BOOT_JDK_VERSION: "26.0.2"
      BOOT_JDK_FILENAME: "jdk-26.0.2_windows-x64_bin.zip"
      BOOT_JDK_URL: "https://download.oracle.com/java/26/archive/jdk-26.0.2_windows-x64_bin.zip"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Download boot JDK
        run: |
          mkdir -p "$HOME\bootjdk"
          & curl -L "$env:BOOT_JDK_URL" -o "$HOME/bootjdk/$env:BOOT_JDK_FILENAME"
          tar -xf "$HOME/bootjdk/$env:BOOT_JDK_FILENAME" -C "$HOME/bootjdk"

      - name: Setup environment
        run: |
          $env:JAVA_HOME = "$HOME\bootjdk\jdk-$env:BOOT_JDK_VERSION" ;
          echo "JAVA_HOME=$env:JAVA_HOME"
          $env:Path = "$env:JAVA_HOME\bin;$env:Path" ;
          echo "Path=$env:Path"
          java -version
          mvn -version
          cmake --version

          # Save JAVA_HOME and Path (renamed to THE_PATH) in env variables
          echo "JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "THE_PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME"
          $env:Path = "$env:THE_PATH" ;
          echo "Path=$env:Path"
          # Full build: Java modules, native libraries (CMake + MSVC) and the
          # unit test suite. Web and system tests are skipped by default.
          mvn -B -ntp install
