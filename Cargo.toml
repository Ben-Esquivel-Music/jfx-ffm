# The Rust workspace of the native libraries. Each library that is part Rust has one crate in
# modules/<module>/src/main/native-rust/<library>, built as a staticlib into that library's CMake target.
# Every cargo call of the build runs with --locked --offline.
[workspace]
resolver = "3"
members = [
    "modules/*/src/main/native-rust/*",
    "buildtools/rust/jfx-rust-support",
]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "GPL-2.0-only WITH Classpath-exception-2.0"
publish = false

[workspace.dependencies]
jfx-rust-support = { path = "buildtools/rust/jfx-rust-support" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# panic is left at Cargo's default "unwind": every export catches panics through jfx_rust_support::guard and
# returns the C failure value, which "abort" would turn into a process abort without an hs_err file.
[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1

[profile.dev]
debug = true
