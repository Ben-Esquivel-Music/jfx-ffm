# cbindgen run 1 for abi_check.cpp: the crate's extern "C" functions, under the Rust names of their types, which
# are the type names of glass_win_api.h. Redeclaring them next to the header makes any prototype difference a
# compile error. A function the crate defines is written as a declaration, one it calls (an unsafe extern "C"
# block) as an "extern" declaration. Nothing else is emitted: no include guard, no types, no constants.
language = "C++"
no_includes = true
sys_includes = ["stdint.h"]
documentation = false
autogen_warning = "/* Generated by cbindgen from the glass-win crate for abi_check.cpp. Do not edit. */"

# An item of the test-hooks feature, which only the test build of glass.dll links, comes out inside
# #if defined(GLASS_WIN_TEST_HOOKS), the macro under which glass_win_api.h declares the test hooks.
[defines]
"feature = test-hooks" = "GLASS_WIN_TEST_HOOKS"

[export]
item_types = ["functions"]
