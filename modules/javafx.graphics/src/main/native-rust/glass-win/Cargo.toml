# The Rust part of glass.dll: linked into the CMake targets glass and glass_test as a staticlib, behind the
# unchanged modules/javafx.graphics/src/main/native-glass/win/glass_win_api.h. Windows only: on Linux and macOS the
# crate is an empty library and nothing links it.
[package]
name = "glass-win"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# The test build of glass.dll (target glass_test, compiled with GLASS_WIN_TEST_HOOKS) links the archive built with
# this feature; the release glass.dll links the one built without it, which holds no test hook.
test-hooks = []

[dependencies]
jfx-rust-support.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["UI_ViewManagement", "Networking_Connectivity", "Win32_System_WinRT"] }

[lints]
workspace = true
